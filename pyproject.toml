[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meloshelf"
version = "0.2.1"
description = "Local-first cross-platform music library organizer with acoustic recognition and review"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joy Daniel" }]
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47,<2", "keyring>=25,<26"]  # MIT: secure storage in the OS credential store

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "PySide6-Addons>=6.8,<7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meloshelf.presentation" = ["web/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
